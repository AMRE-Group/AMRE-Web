<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cash &amp; Flow — Multifamily Investment Calculator by AMRE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --f:#1c3d31;--n:#070B33;--b:#ffc13c;--ink:#1a1a1a;
  --mist:#f4f6f3;--bdr:#e2e8e4;--pos:#2e7d52;--neg:#b45309;--tip:#2a2a2a
}
body{font-family:'Montserrat',sans-serif;background:var(--mist);color:var(--ink);min-height:100vh}

/* NAV */
.site-nav{position:fixed;top:0;left:0;right:0;z-index:500;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:rgba(7,11,51,0.88);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(255,255,255,0.08);transition:background .35s ease,border-color .35s}
.site-nav.is-light{background:rgba(255,255,255,0.92);border-bottom-color:rgba(0,0,0,.1)}
.nav-brand{display:flex;align-items:center;flex-shrink:0;text-decoration:none}
.nav-amre{height:22px;width:auto}
.nav-compass{height:15px;width:auto;opacity:.85}
.logo-white{display:block}.logo-dark{display:none}
.site-nav.is-light .logo-dark{display:block}
.site-nav.is-light .logo-white{display:none}
.nav-sep{width:1px;height:18px;background:rgba(255,255,255,.25);margin:0 14px;transition:background .35s}
.site-nav.is-light .nav-sep{background:rgba(0,0,0,.15)}
.nav-links{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:28px;list-style:none}
.nav-links a{font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.82);transition:color .2s;white-space:nowrap;text-decoration:none}
.site-nav.is-light .nav-links a{color:rgba(7,11,51,.65)}
.nav-links a:hover{color:#fff}
.site-nav.is-light .nav-links a:hover{color:#1c3d31}
.nav-right{display:flex;align-items:center;gap:12px}
.nav-cta{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:9px 20px;border-radius:2px;background:#ffc13c;color:#070B33;transition:opacity .2s,transform .15s;white-space:nowrap;flex-shrink:0;text-decoration:none;display:inline-block}
.nav-cta:hover{opacity:.88;transform:translateY(-1px)}
.ham-btn{display:none;flex-direction:column;justify-content:center;gap:5px;width:36px;height:36px;padding:7px;background:none;border:none;cursor:pointer}
.ham-btn span{display:block;width:22px;height:2px;background:#fff;border-radius:2px}
.site-nav.is-light .ham-btn span{background:#070B33}

/* HERO */
.hero{background:var(--f);padding:calc(56px + 56px) 48px 52px;text-align:center}
.hero-brand{display:block;height:88px;width:auto;max-width:400px;margin:0 auto 20px;mix-blend-mode:screen;filter:brightness(1.1)}
.eyebrow{display:inline-block;background:rgba(255,193,60,.15);border:1px solid rgba(255,193,60,.35);color:var(--b);font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:5px 14px;border-radius:20px;margin-bottom:14px}
.hero h1{font-family:'Playfair Display',serif;color:white;font-size:clamp(22px,3.5vw,40px);font-weight:700;line-height:1.2;max-width:560px;margin:0 auto 12px}
.hero p{color:rgba(255,255,255,.55);font-size:13px;max-width:480px;margin:0 auto;line-height:1.75}

/* LAYOUT */
.wrap{max-width:1080px;margin:0 auto;padding:48px 28px 96px;display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}

/* PANELS */
.panel{background:white;border-radius:14px;padding:30px;border:1px solid var(--bdr);box-shadow:0 2px 12px rgba(0,0,0,.05)}
.ptitle{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;color:var(--f);margin-bottom:3px}
.psub{font-size:10px;font-weight:600;color:#8a9e92;letter-spacing:.06em;text-transform:uppercase;margin-bottom:24px}
.slabel{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#b0c4b8;margin-bottom:13px;display:block}
.divider{height:1px;background:var(--bdr);margin:20px 0}

/* FIELDS */
.field{margin-bottom:16px}
.field-head{display:flex;align-items:center;gap:6px;margin-bottom:7px}
.field-head label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#5a7060}
.field-hint{font-size:10px;color:#8a9e92;margin-top:5px;line-height:1.5;padding:6px 10px;background:var(--mist);border-radius:6px;border-left:2px solid var(--bdr)}
.field-hint.derived{border-left-color:var(--b);background:rgba(255,193,60,.06)}
.auto-tag{font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;background:rgba(28,61,49,.1);color:var(--f);border-radius:4px;padding:2px 7px;margin-left:2px;white-space:nowrap}

/* TOOLTIP */
.tip{position:relative;display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;background:var(--bdr);border-radius:50%;cursor:help;flex-shrink:0}
.tip span{font-size:9px;font-weight:700;color:#7a9280}
.tip:hover .tip-box{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.tip-box{position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%) translateY(4px);background:var(--tip);color:white;font-size:11px;line-height:1.55;padding:10px 13px;border-radius:8px;width:220px;white-space:normal;opacity:0;pointer-events:none;transition:all .2s;z-index:100;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.tip-box::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--tip)}
.tip-inline{margin-left:6px;vertical-align:middle}
.tip-inline .tip-box{width:280px;font-size:11px}

/* INPUTS */
.irow{display:flex;align-items:center}
.pre,.suf{background:var(--mist);border:1px solid var(--bdr);height:42px;display:flex;align-items:center;padding:0 11px;font-size:13px;font-weight:600;color:#7a9280;flex-shrink:0;white-space:nowrap}
.pre{border-right:none;border-radius:8px 0 0 8px}
.suf{border-left:none;border-radius:0 8px 8px 0}
input[type=number],select{height:42px;border:1px solid var(--bdr);border-radius:8px;padding:0 13px;font-family:'Montserrat',sans-serif;font-size:14px;font-weight:500;color:var(--ink);background:white;outline:none;width:100%;-moz-appearance:textfield;appearance:none}
input[type=number]:focus,select:focus{border-color:var(--f);box-shadow:0 0 0 3px rgba(28,61,49,.08)}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
.has-pre input{border-left:none;border-radius:0 8px 8px 0}
.has-suf input{border-right:none;border-radius:8px 0 0 8px}

/* TWO-COL INPUT ROW */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* CASH TO CLOSE CARD */
.ctc-card{background:var(--n);border-radius:10px;padding:16px;margin-top:8px}
.ctc-label{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:12px}
.ctc-row{display:flex;justify-content:space-between;align-items:center;font-size:11px;margin-bottom:7px}
.ctc-row:last-of-type{margin-bottom:0}
.ctc-lbl{color:rgba(255,255,255,.55);font-weight:400}
.ctc-amt{color:white;font-weight:600;font-family:'Playfair Display',serif;font-size:13px}
.ctc-amt.reserve{color:rgba(255,193,60,.85)}
.ctc-sep{height:1px;background:rgba(255,255,255,.1);margin:10px 0}
.ctc-total-row{display:flex;justify-content:space-between;align-items:center}
.ctc-total-lbl{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.45)}
.ctc-total-val{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:var(--b)}

/* RESULTS */
.rp{position:sticky;top:76px}
.kpi{background:var(--f);border-radius:12px;padding:24px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
.kpi-lbl{font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:rgba(255,255,255,.55);margin-bottom:8px}
.kpi-val{font-family:'Playfair Display',serif;font-size:38px;font-weight:700;color:white;line-height:1}
.kpi-val .unit{font-size:18px;font-weight:600;color:rgba(255,255,255,.7);margin-left:3px}
.kpi-sub{font-size:11px;color:rgba(255,255,255,.55);margin-top:8px;line-height:1.5}
.kpi-mult{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;color:var(--b);line-height:1}
.kpi-mult-lbl{font-size:9px;color:rgba(255,255,255,.5);margin-top:5px;letter-spacing:.05em;text-transform:uppercase;font-weight:700}
.kpi-hint{font-size:10px;color:rgba(255,255,255,.4);margin-top:10px;font-style:italic}
.badge{background:rgba(255,193,60,.2);border:1px solid rgba(255,193,60,.4);color:var(--b);font-size:10px;font-weight:700;letter-spacing:.05em;padding:5px 12px;border-radius:20px;white-space:nowrap}

/* CoC time-period row */
.coc-row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-bottom:18px}
.coc-card{background:white;border:1px solid var(--bdr);border-radius:10px;padding:11px 9px;text-align:center}
.coc-lbl{font-size:8px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8a9e92;margin-bottom:4px}
.coc-val{font-family:'Playfair Display',serif;font-size:15px;font-weight:700;color:var(--f);line-height:1.1}
.coc-val.pos{color:var(--pos)} .coc-val.neg{color:var(--neg)} .coc-val.warn{color:#b58105}

/* ADU + Depreciation educational callouts */
.adu-tip{display:flex;gap:14px;align-items:flex-start;background:linear-gradient(135deg,rgba(255,193,60,.10),rgba(255,193,60,.02));border:1px solid rgba(255,193,60,.35);border-radius:10px;padding:14px 16px;margin-bottom:18px}
.adu-tip-icon{flex-shrink:0;width:30px;height:30px;border-radius:50%;background:var(--b);color:#1a1a1a;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:18px;line-height:1}
.adu-tip-title{font-size:12px;font-weight:700;color:var(--f);margin-bottom:4px;letter-spacing:.02em}
.adu-tip-body{font-size:11px;color:#3d4f44;line-height:1.55}
.adu-tip-body strong{color:var(--f)}

.depreciation-note{background:var(--mist);border:1px solid var(--bdr);border-left:3px solid var(--f);border-radius:8px;padding:12px 16px;margin-bottom:18px;font-size:11px;color:#5a7060;line-height:1.55}
.depreciation-note strong{color:var(--f);display:block;margin-bottom:3px;font-size:11px;letter-spacing:.04em;text-transform:uppercase;font-weight:700}
.mgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-bottom:18px}
.mc{background:var(--mist);border-radius:10px;padding:13px 12px;border:1px solid var(--bdr)}
.mc-lbl{font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#8a9e92;margin-bottom:5px}
.mc-val{font-family:'Playfair Display',serif;font-size:19px;font-weight:700;color:var(--f);line-height:1.1}
.mc-val.pos{color:var(--pos)}.mc-val.neg{color:var(--neg)}.mc-val.warn{color:#b58105}
.mc-det{font-size:10px;color:#8a9e92;margin-top:3px;line-height:1.3}
@media(max-width:520px){.mgrid{grid-template-columns:1fr 1fr}}
.brow{margin-bottom:12px}
.brow-hd{display:flex;justify-content:space-between;font-size:10px;font-weight:600;margin-bottom:6px}
.brow-hd .lbl{color:#5a7060;letter-spacing:.06em;text-transform:uppercase}
.brow-hd .amt{font-family:'Playfair Display',serif;font-size:13px;color:var(--f)}
.btrack{height:7px;background:var(--bdr);border-radius:4px;overflow:hidden}
.bfill{height:100%;border-radius:4px;transition:width .5s ease}
.bfill.inc{background:var(--f)}.bfill.exp{background:#e8c87a}.bfill.net{background:var(--b)}
.etbl{width:100%;border-collapse:collapse;font-size:12px}
.etbl th{text-align:left;font-size:9px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#8a9e92;padding:7px 9px;border-bottom:1px solid var(--bdr)}
.etbl td{padding:10px 9px;border-bottom:1px solid #f0f0f0;font-weight:500;color:var(--ink)}
.etbl tr:last-child td{border-bottom:none}
.etbl .eq{color:var(--pos);font-weight:700}
.etbl .cf{color:var(--f);font-weight:600}
.proj-note{font-size:10px;color:#8a9e92;margin-top:8px;line-height:1.5;font-style:italic}
.ctabox{background:linear-gradient(135deg,var(--n) 0%,#1a2060 100%);border-radius:12px;padding:24px;text-align:center;margin-top:4px}
.ctabox h3{font-family:'Playfair Display',serif;color:white;font-size:16px;margin-bottom:8px}
.ctabox p{color:rgba(255,255,255,.5);font-size:11px;margin-bottom:16px;line-height:1.65}
.ctabtn{background:var(--b);color:var(--n);font-family:'Montserrat',sans-serif;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border:none;border-radius:5px;padding:12px 20px;cursor:pointer;width:100%;transition:opacity .2s}
.ctabtn:hover{opacity:.85}

/* ── EXIT ANALYSIS ── */
.exit-panel{background:white;border-radius:14px;border:1px solid var(--bdr);box-shadow:0 2px 12px rgba(0,0,0,.05);margin-bottom:18px;overflow:hidden}
.exit-header{background:var(--n);padding:20px 24px 16px}
.exit-header-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.exit-title{font-family:'Playfair Display',serif;font-size:17px;font-weight:700;color:white}
.exit-subtitle{font-size:10px;color:rgba(255,255,255,.45);margin-top:3px;font-weight:400}
.exit-roi-big{text-align:right}
.exit-roi-lbl{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:4px}
.exit-roi-val{font-family:'Playfair Display',serif;font-size:32px;font-weight:700;color:var(--b);line-height:1}
.exit-roi-sub{font-size:10px;color:rgba(255,255,255,.4);margin-top:3px}

/* Year selector pills */
.year-pills{display:flex;gap:6px;flex-wrap:nowrap}
.yr-pill{flex:1;height:30px;border:1px solid rgba(255,255,255,.2);border-radius:4px;background:transparent;color:rgba(255,255,255,.55);font-family:'Montserrat',sans-serif;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center}
.yr-pill:hover{border-color:rgba(255,255,255,.5);color:white}
.yr-pill.active{background:var(--b);border-color:var(--b);color:var(--n)}

/* Cash flow bar chart */
/* Wealth Growth Chart */
.wealth-chart{padding:22px 24px 18px}
.wealth-chart-title{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--f);margin-bottom:5px}
.wealth-chart-sub{font-size:10px;color:#8a9e92;margin-bottom:14px;line-height:1.45}
#wealthSvg{display:block;width:100%;height:auto;aspect-ratio:600/240;overflow:visible}
.wealth-legend{display:flex;justify-content:center;gap:18px;margin-top:8px;flex-wrap:wrap}
.wleg-item{display:flex;align-items:center;gap:6px;font-size:10px;color:#5a7060;font-weight:600}
.wleg-dot{width:10px;height:10px;border-radius:2px;display:inline-block}

/* Exit breakdown */
.exit-breakdown{padding:20px 24px}
.exit-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f0f0f0;font-size:12px}
.exit-row:last-of-type{border-bottom:none}
.exit-row-lbl{color:#6b7280;font-weight:400}
.exit-row-val{font-family:'Playfair Display',serif;font-size:14px;font-weight:700;color:var(--ink)}
.exit-row-val.pos{color:var(--pos)}
.exit-row-val.neg{color:var(--neg)}
.exit-row-val.highlight{color:var(--f)}
.exit-row.total-row{margin-top:4px;padding-top:12px;border-top:2px solid var(--bdr);border-bottom:none}
.exit-row.total-row .exit-row-lbl{font-weight:700;font-size:13px;color:var(--ink)}
.exit-row.total-row .exit-row-val{font-size:18px;color:var(--pos)}
.exit-row.deduct .exit-row-val{color:var(--neg)}
.exit-sale-cost-input{display:flex;align-items:center;gap:6px}
.exit-sale-cost-input input{width:52px;height:26px;border:1px solid var(--bdr);border-radius:4px;text-align:center;font-family:'Montserrat',sans-serif;font-size:12px;font-weight:600;color:var(--ink);-moz-appearance:textfield}
.exit-sale-cost-input input::-webkit-outer-spin-button,.exit-sale-cost-input input::-webkit-inner-spin-button{-webkit-appearance:none}
.exit-sale-cost-input span{font-size:11px;color:#8a9e92}

/* Summary stats row */
.exit-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--bdr);margin:0 0 0 0;border-top:1px solid var(--bdr)}
.exit-stat{background:var(--mist);padding:14px 16px;text-align:center}
.exit-stat-lbl{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8a9e92;margin-bottom:5px}
.exit-stat-val{font-family:'Playfair Display',serif;font-size:17px;font-weight:700;color:var(--f)}
.exit-stat-val.brass{color:#b8860b}

/* ── Return Sources (Where Returns Come From) ── */
.exit-sources{padding:24px 24px 28px;border-top:1px solid var(--bdr);background:var(--mist)}
.exit-sources-title{font-family:'Playfair Display',serif;font-size:16px;font-weight:700;color:var(--f);margin-bottom:6px}
.exit-sources-sub{font-size:11px;color:#5a7060;line-height:1.55;margin-bottom:18px}
.src-row{display:grid;grid-template-columns:170px 1fr 110px;gap:14px;align-items:center;padding:9px 0;font-size:12px}
.src-row-lbl{color:var(--ink);font-weight:600}
.src-row-bar{height:8px;background:rgba(28,61,49,.08);border-radius:4px;overflow:hidden}
.src-row-fill{height:100%;background:var(--f);border-radius:4px;transition:width .5s ease}
.src-row-fill.brass{background:var(--b)}
.src-row-fill.neg{background:var(--neg)}
.src-row-val{font-family:'Playfair Display',serif;font-weight:700;color:var(--f);text-align:right;font-size:15px}
.src-row-val.neg{color:var(--neg)}
.src-total{margin-top:14px;padding-top:14px;border-top:1px solid var(--bdr);display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#5a7060;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.src-total-val{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;color:var(--f);text-transform:none;letter-spacing:0}
@media (max-width:680px){
  .src-row{grid-template-columns:1fr 90px;grid-template-rows:auto auto;gap:6px 12px}
  .src-row-lbl{grid-column:1/2;grid-row:1}
  .src-row-val{grid-column:2/3;grid-row:1}
  .src-row-bar{grid-column:1/3;grid-row:2}
}


/* ── EMAIL MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(7,11,51,.6);backdrop-filter:blur(6px);z-index:900;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal-box{background:white;border-radius:20px 20px 0 0;padding:36px 32px 40px;width:100%;max-width:520px;transform:translateY(40px);transition:transform .35s cubic-bezier(.25,.46,.45,.94);max-height:90vh;overflow-y:auto}
.modal-overlay.open .modal-box{transform:translateY(0)}
.modal-handle{width:40px;height:4px;background:var(--bdr);border-radius:2px;margin:0 auto 24px}
.modal-title{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:var(--f);margin-bottom:6px}
.modal-sub{font-size:12px;color:#8a9e92;line-height:1.6;margin-bottom:24px}
.modal-field{margin-bottom:16px}
.modal-field label{display:block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#5a7060;margin-bottom:7px}
.modal-field input{width:100%;height:44px;border:1px solid var(--bdr);border-radius:8px;padding:0 14px;font-family:'Montserrat',sans-serif;font-size:14px;font-weight:500;color:var(--ink);outline:none;transition:border-color .2s}
.modal-field input:focus{border-color:var(--f);box-shadow:0 0 0 3px rgba(28,61,49,.08)}
.modal-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-optin{display:flex;align-items:flex-start;gap:10px;margin:20px 0 24px;padding:14px;background:var(--mist);border-radius:8px;cursor:pointer}
.modal-optin input[type=checkbox]{width:16px;height:16px;flex-shrink:0;margin-top:2px;accent-color:var(--f)}
.modal-optin-text{font-size:11px;color:#5a7060;line-height:1.5}
.modal-optin-text strong{color:var(--f);font-weight:600}
.modal-submit{width:100%;height:50px;background:var(--f);color:white;font-family:'Montserrat',sans-serif;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border:none;border-radius:8px;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px}
.modal-submit:hover{background:#153329;transform:translateY(-1px)}
.modal-submit:disabled{opacity:.6;cursor:not-allowed;transform:none}
.modal-close{position:absolute;top:16px;right:16px;width:32px;height:32px;border:none;background:var(--mist);border-radius:50%;cursor:pointer;font-size:16px;color:#8a9e92;display:flex;align-items:center;justify-content:center}
.modal-box{position:relative}
.modal-success{text-align:center;padding:20px 0}
.modal-success-icon{font-size:48px;margin-bottom:16px}
.modal-success h3{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:var(--f);margin-bottom:8px}
.modal-success p{font-size:13px;color:#8a9e92;line-height:1.65;max-width:340px;margin:0 auto 24px}
.modal-success-done{width:100%;height:44px;background:var(--mist);border:1px solid var(--bdr);border-radius:8px;font-family:'Montserrat',sans-serif;font-size:12px;font-weight:600;color:var(--f);cursor:pointer}
.modal-error{font-size:11px;color:var(--neg);margin-top:8px;display:none}
@media(min-width:600px){.modal-overlay{align-items:center}.modal-box{border-radius:20px;margin:20px}}

.foot{background:var(--n);padding:28px 48px 20px;text-align:center;color:rgba(255,255,255,.3);font-size:10px;letter-spacing:.04em}
.foot strong{color:rgba(255,255,255,.6)}

@media(max-width:860px){.nav-links{display:none}.site-nav{padding:0 20px}.ham-btn{display:flex}}
@media(max-width:820px){.wrap{grid-template-columns:1fr}.rp{position:static}.hero{padding:calc(56px + 40px) 24px 36px}.wrap{padding:32px 16px 56px}}
